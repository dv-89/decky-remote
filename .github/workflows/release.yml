name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package version as a GitHub release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate version and tag
        id: metadata
        run: python scripts/release_tools.py metadata
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:client
      - run: npm run test:dolphin
      - run: npm run build
      - run: npm run test:bundle
      - run: npm run package
      - name: Verify installable archive
        run: python scripts/release_tools.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decky-remote-${{ steps.metadata.outputs.version }}
          path: release/decky-remote-${{ steps.metadata.outputs.version }}.zip*
          if-no-files-found: error
          retention-days: 14

  helper:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test Windows helper
        run: python -m unittest discover -s tests -p test_helper.py -v
      - name: Install helper packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - name: Build portable Windows helper
        run: python scripts/build_helper.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decky-remote-laptop-${{ needs.build.outputs.version }}-windows
          path: release/decky-remote-laptop-${{ needs.build.outputs.version }}-windows.zip*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, helper]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: decky-remote-${{ needs.build.outputs.version }}
          path: release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: decky-remote-laptop-${{ needs.build.outputs.version }}-windows
          path: release
      - name: Publish verified ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # A manual run must never associate new code with an older version tag.
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "::error::This version tag points to another commit. Bump the package version or run the workflow on that tag."
              exit 1
            }
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::This release already exists. Existing releases are never overwritten; use a new version."
            exit 1
          fi
          (cd release && sha256sum --check "decky-remote-$VERSION.zip.sha256")
          (cd release && sha256sum --check "decky-remote-laptop-$VERSION-windows.zip.sha256")
          preview_args=()
          title="Decky Remote $VERSION"
          if [ "$PRERELEASE" = "true" ]; then
            preview_args=(--prerelease)
            title="$title — Preview"
          fi
          # Upload to a draft first so a failed upload cannot publish an empty release.
          gh release create "$TAG" \
            "release/decky-remote-$VERSION.zip" \
            "release/decky-remote-$VERSION.zip.sha256" \
            "release/decky-remote-laptop-$VERSION-windows.zip" \
            "release/decky-remote-laptop-$VERSION-windows.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --generate-notes --draft "${preview_args[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
